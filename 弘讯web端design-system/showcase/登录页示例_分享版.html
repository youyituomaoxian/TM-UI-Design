.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-sm);padding:var(--space-xxl) var(--space-base);text-align:center;}
.empty-ico{width:48px;height:48px;border-radius:var(--radius-round);background:var(--n3);color:var(--text-3);display:flex;align-items:center;justify-content:center;}
.empty-ico svg{width:24px;height:24px;display:block;}
.empty-title{font-size:14px;font-weight:500;color:var(--text-1);}
.empty-desc{font-size:12px;color:var(--text-3);}
.empty-actions{display:flex;align-items:center;gap:var(--space-sm);margin-top:var(--space-xs);}
.steps{display:flex;align-items:center;width:100%;}
.step{display:flex;align-items:center;gap:8px;min-width:0;flex:none;}
.step-dot{width:24px;height:24px;border-radius:var(--radius-round);border:1px solid var(--n6);background:var(--bg-surface);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
.step-text{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step.is-done .step-dot{background:var(--primary);border-color:var(--primary);color:var(--text-on-brand);}
.step.is-done .step-text{color:var(--text-2);}
.step.is-active .step-dot{border-color:var(--primary);color:var(--primary);font-weight:600;}
.step.is-active .step-text{color:var(--text-1);font-weight:500;}
.step-line{flex:1;height:1px;background:var(--n6);margin:0 var(--space-sm);min-width:16px;}
.flow{display:flex;flex-direction:column;}
.flow-step{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-xs) 0;border-radius:var(--radius-base);
  transition:background var(--motion-duration-fast) var(--motion-ease-out);}
.flow-step:hover{background:var(--n3);}
.flow-ico{width:28px;height:28px;flex:none;border-radius:var(--radius-md);background:var(--n3);color:var(--n10);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--motion-duration-fast) var(--motion-ease-out),color var(--motion-duration-fast) var(--motion-ease-out),transform var(--motion-duration-fast) var(--motion-ease-out);}
.flow-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.flow-info{flex:1;min-width:0;}
.flow-tag{margin-left:var(--space-sm);}
.flow-conn{width:28px;margin:0 auto;height:12px;border-left:2px dashed var(--n6);}
.flow-pulse{animation:pulse var(--motion-duration-slow) var(--motion-ease-in-out) infinite;}
.flow-step.is-err .flow-ico{background:var(--err-soft);color:var(--err);transform:scale(1.08);}
.flow-step.is-warn .flow-ico{background:var(--warn-soft);color:color-mix(in srgb, var(--warn) 55%, var(--n11));}
.flow--row{flex-direction:row;align-items:stretch;gap:var(--space-sm);}
.flow--row .flow-step{flex:1;min-width:0;align-items:center;text-align:left;
  padding:var(--space-sm) var(--space-md);border:1px solid var(--n6);background:var(--bg-surface);}
.flow--row .flow-info{flex:1;min-width:0;}
.flow--row .flow-step.is-err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft);}
.flow--row .flow-step.is-warn{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);}
.flow-arrow{flex:none;width:24px;align-self:center;height:0;border-top:2px solid var(--n6);position:relative;}
.flow-arrow::after{content:'';position:absolute;right:-2px;top:-7px;border:6px solid transparent;border-left-color:var(--n6);}
.flow-arrow.is-err{border-top-color:var(--err);}
.flow-arrow.is-err::after{border-left-color:var(--err);}
.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:var(--space-md);position:relative;padding-bottom:var(--space-base);}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{width:8px;height:8px;border-radius:var(--radius-round);border:1px solid var(--n6);background:var(--bg-surface);margin-top:6px;flex:none;position:relative;z-index:1;}
.tl-item.is-active .tl-dot{background:var(--primary);border-color:var(--primary);}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--n6);}
.tl-time{font-size:12px;color:var(--text-3);}
.tl-text{font-size:14px;color:var(--text-2);}
.descriptions{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 var(--space-lg);}
.desc-item{display:flex;align-items:center;gap:var(--space-sm);min-height:40px;border-bottom:1px solid var(--n6);min-width:0;}
.desc-label{width:96px;flex:none;font-size:13px;color:var(--text-3);}
.desc-value{font-size:14px;color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.login-shell{position:relative;display:grid;grid-template-columns:58fr 42fr;grid-template-rows:1fr;min-height:100vh;background:var(--n4);}
.login-hero{position:relative;overflow:hidden;min-height:100vh;background:radial-gradient(90% 70% at 38% 55%,var(--n3),var(--n1) 70%);}
.login-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;}
.login-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(100% - var(--login-hero-feather)),var(--n4));}
.login-panel{display:flex;align-items:center;justify-content:center;padding:var(--space-xxl);}
.login-col{width:var(--login-card-w);max-width:100%;}
.login-head{display:flex;align-items:center;margin-bottom:var(--space-lg);}
.login-head img{display:block;height:40px;width:auto;}
.login-logo{width:40px;height:40px;flex:none;display:flex;}
.login-head-text{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0;}
.login-name,.login-desc{margin:0;font-family:var(--font-cn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.login-name{font-size:24px;line-height:32px;font-weight:500;color:var(--n11);}
.login-desc{font-size:13px;line-height:20px;color:var(--n9);}
.login-lang.lang-sel{position:absolute;top:var(--space-lg);right:var(--space-xl);z-index:20;}
.login-lang .lang-trigger{height:32px;background:var(--n1);border:1px solid var(--n6);color:var(--n10);}
.login-lang .lang-trigger:hover{background:var(--n3);}
.login-lang .lang-trigger .ico{color:var(--n9);}
.login-card{width:var(--login-card-w);max-width:100%;padding:var(--space-xl) var(--login-card-pad);background:var(--n1);border-radius:var(--radius-md);box-shadow:var(--shadow-card);}
.login-card-title{margin:0 0 var(--space-lg);font-family:var(--font-cn);font-size:18px;line-height:26px;font-weight:500;color:var(--n11);}
.input-lg{height:40px;}
.login-input{width:100%;}
.login-field + .login-field{margin-top:var(--space-base);}
.login-label{display:block;margin:0 0 var(--space-sm);color:var(--n10);}
.login-link{color:var(--primary);text-decoration:none;border-radius:var(--radius-control);}
.login-link:hover{color:var(--primary-hover);}
.login-link:focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus-ring);}
.login-phone{display:flex;gap:var(--space-sm);margin-bottom:var(--space-base);}
.login-password{position:relative;}
.login-password + .login-password{margin-top:var(--space-base);}
.login-eye .ico-on{display:none;}
.login-eye[aria-pressed="true"] .ico-off{display:none;}
.login-eye[aria-pressed="true"] .ico-on{display:block;}
.login-input--pwd{padding-right:48px;}
.login-eye{position:absolute;right:0;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:var(--radius-control);color:var(--n9);cursor:pointer;}
.login-eye:hover{color:var(--n10);background:var(--n4);}
.login-check{display:inline-flex;align-items:center;gap:var(--space-sm);font-size:14px;cursor:pointer;}
.login-check input{width:16px;height:16px;margin:0;accent-color:var(--primary);}
.login-opt{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-md);}
.login-submit{width:100%;margin-top:var(--space-base);}
.login-help{margin:var(--space-base) 0 0;text-align:center;font-family:var(--font-cn);font-size:12px;line-height:16px;color:var(--n9);}
.login-legal{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:var(--space-sm);margin-top:var(--space-lg);padding-top:var(--space-base);border-top:1px solid var(--n5);font-family:var(--font-cn);font-size:12px;line-height:16px;color:var(--n9);}
.login-legal-links{display:flex;flex-wrap:wrap;gap:var(--space-sm);min-width:0;}
.login-legal a{color:var(--n9);text-decoration:none;}
.login-legal a:hover{color:var(--primary-hover);}
.login-copy{margin-left:0;color:var(--n8);}
html[lang="en"] .login-legal{justify-content:center;text-align:center;}
@media (max-width:1199px){
.login-shell{grid-template-columns:1fr;grid-template-rows:280px auto;}
.login-hero{height:280px;min-height:0;}
.login-hero img{object-fit:contain;}
.login-hero::after{background:linear-gradient(to bottom,transparent calc(100% - 80px),var(--n4));}
.login-panel{padding:var(--space-xl) var(--space-lg) var(--space-xxl);}
}
@media (max-height:700px){.login-panel{padding:var(--space-lg);}}
.login-cc{width:112px;min-width:0;flex:none;}
.login-cc .sel-trigger{height:40px;padding:0 8px;gap:6px;font-size:14px;}
.login-cc .sel-trigger .ico{width:14px;height:14px;flex:none;}
.login-cc .sel-panel{min-width:210px;max-height:320px;}
.login-cc-code{color:var(--n10);}
.login-cc-flag{width:16px;height:12px;flex:none;border-radius:2px;display:block;background:#fff;outline:1px solid rgba(0,0,0,.18);outline-offset:-1px;}
.login-cc .sel-opt{gap:8px;}
.login-cc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.login-cc-opt-code{margin-left:auto;color:var(--n9);font-size:12px;}
.login-code{display:flex;gap:var(--space-sm);margin-top:var(--space-base);}
.login-code>.input{flex:1;width:auto;}
.login-code-btn{flex:none;height:40px;padding:0 12px;font-size:13px;}
.login-steps{margin:2px 0 var(--space-lg);}
.login-hint{margin:var(--space-sm) 0 0;font-size:12px;line-height:16px;color:var(--n9);}
.input.is-error{border-color:var(--err);}
.input.is-error:focus{border-color:var(--err);box-shadow:0 0 0 2px var(--err-soft);}
.login-alert{margin:0 0 var(--space-base);padding:8px 12px;border-radius:var(--radius-base);background:var(--err-soft);color:var(--err-active);font-size:12px;line-height:16px;}
.login-done{display:flex;flex-direction:column;align-items:center;gap:var(--space-sm);padding:var(--space-base) 0 var(--space-sm);text-align:center;}
.login-done-ico{width:56px;height:56px;border-radius:var(--radius-round);background:var(--run-soft);color:var(--run);display:flex;align-items:center;justify-content:center;}
.login-done-title{font-size:14px;font-weight:500;color:var(--n11);}
.login-done-desc{font-size:12px;line-height:16px;color:var(--n9);}
.login-view[hidden]{display:none;}
.table tr.is-placeholder td{height:44px;border-bottom:1px solid var(--n6)}
.stat-card--compact{padding:10px 14px}
.stat-card--compact .stat-num{font-size:22px;line-height:1.1}
.t-h1{margin:0}
.tree .ico,.tree-ico .ico{color:inherit}
.dot-alarm{background:var(--err)}
.page-head .t-h1::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:20px;border-radius:2px;background:var(--primary)}
.machine-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.machine-card{background:var(--bg-surface);border:1px solid var(--n6);border-left:3px solid var(--run);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow-card);}
.machine-card--idle{border-left-color:var(--state-idle);}
.machine-card--off,.machine-card--stop{border-left-color:var(--state-stop);}
.machine-card--fault{border-left-color:var(--state-fault);}
.machine-card--offline{border-left-color:var(--state-offline);border-left-style:dashed;}
.mc-head{display:flex;align-items:center;gap:8px;min-width:0;}
.mc-title{font-size:16px;line-height:24px;font-weight:600;color:var(--text-1);}
.mc-code{font-size:12px;line-height:16px;color:var(--text-3);}
.mc-badge{margin-left:auto;}
.mc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
.mc-label{display:block;font-size:11px;line-height:16px;color:var(--text-3);margin-bottom:2px;}
.mc-val{display:block;font-size:13px;line-height:20px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-cycle{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 0;border-top:1px solid var(--n6);border-bottom:1px solid var(--n6);}
.mc-cycle .mc-label{margin-bottom:0;}
.mc-cycle strong{font-family:var(--font-mono);font-size:24px;line-height:28px;font-weight:500;color:var(--text-1);}
.mc-cycle small{font-size:11px;color:var(--text-3);margin-left:2px;font-family:var(--font-cn);}
.mc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--n3);border-radius:var(--radius-md);padding:8px 4px;text-align:center;min-width:0;}
.mc-metrics span{display:block;font-size:11px;line-height:16px;color:var(--text-3);margin-bottom:2px;}
.mc-metrics strong{font-family:var(--font-mono);font-size:13px;line-height:18px;font-weight:500;color:var(--text-1);}
.mc-metrics small{font-size:10px;color:var(--text-3);margin-left:1px;}
.mc-prog-head{display:flex;justify-content:space-between;font-size:12px;line-height:18px;color:var(--text-3);margin-bottom:4px;}
.mc-prog-head strong{font-family:var(--font-mono);color:var(--primary);font-weight:500;}
.mc-bar{height:6px;background:var(--n3);border-radius:3px;overflow:hidden;}
.mc-bar span{display:block;height:100%;background:var(--primary);border-radius:3px;}
.mc-foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:16px;color:var(--text-3);}
.mc-foot .mono{font-family:var(--font-mono);color:var(--text-2);}
@media (max-width:1200px){.machine-list{grid-template-columns:1fr;}}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.body{display:flex;flex:1;min-height:0;overflow:hidden;height:calc(100vh - var(--topbar-height));}
:root{--text-on-brand:var(--n1);}
.topbar{height:var(--topbar-height);background:var(--primary);color:var(--text-on-brand);flex-shrink:0;
  display:flex;align-items:center;gap:24px;padding:0 24px;}
.topbar .brand{font-size:18px;font-weight:500;}

.topbar .user{display:flex;align-items:center;gap:8px;}

.lang-trigger:hover{background:rgba(255,255,255,.30);}

      <!-- 登录卡 -->
      <form class="login-card" id="loginForm" novalidate>
        <div class="login-card-title login-head-text">
          <h1 class="login-name" data-i18n="login.sys">弘设汇管理平台</h1>
          <p class="login-desc" data-i18n="login.sysdesc">注塑机 · 智能工厂数据管理</p>
        </div>

        <h2 class="login-card-title" data-i18n="login.title">登录</h2>

        <div class="login-alert" id="loginAlert" role="alert" hidden></div>

        <div class="login-field">
          <label class="t-body1 login-label" for="account" data-i18n="login.account">账号</label>
          <input id="account" name="account" class="input input-lg login-input" type="text"
                 placeholder="请输入账号" data-i18n-ph="login.account.ph" autocomplete="username" spellcheck="false"
                 aria-label="账号" aria-describedby="loginAlert">
        </div>

        <div class="login-field">
          <label class="t-body1 login-label" for="password" data-i18n="login.password">密码</label>
          <div class="login-password">
            <input id="password" name="password" class="input input-lg login-input login-input--pwd" type="password"
                   placeholder="请输入密码" data-i18n-ph="login.password.ph" autocomplete="current-password"
                   aria-label="密码" aria-describedby="loginAlert loginHint">
            <button class="login-eye" id="pwdToggle" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="ico ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 3 3 L 21 21"/><path d="M 20 15 C 20 15 20.5 14 21 13.5 C 21.5 13 22 12 22 12 C 22 12 21 9 17.5 6.5 C 14 4 10 5 10 5"/><path d="M 6 7 C 6 7 4.5 8.5 3.5 9.5 C 2.5 10.5 2 12 2 12 C 2 12 3.5 16.5 8 18.5 C 12.5 20.5 17 17.5 17 17.5"/><path d="M 14 14 C 13.5 14.5 13 15 12 15 C 10.5 15 9 13.5 9 12 C 9 11 9.5 10.5 10 10"/></svg>
              <svg class="ico ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 2 12 C 2 12 5.5 6 12 6 C 18.5 6 22 12 22 12 C 22 12 18.5 18 12 18 C 5.5 18 2 12 2 12 Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="login-hint" id="loginHint" hidden data-i18n="login.caps">大写锁定已开启</p>
        </div>

        <div class="login-opt">
          <label class="login-check"><input type="checkbox" id="remember" name="remember" checked><span data-i18n="login.remember">记住我</span></label>
          <a class="t-link login-link" href="#" id="forgotLink" data-i18n="login.forgot">忘记密码？</a>
        </div>

        <button class="btn btn-primary btn-lg login-submit" id="loginSubmit" type="submit">
          <span class="spinner" id="loginSpin" hidden aria-hidden="true"></span>
          <span class="btn-label" id="loginSubmitText" data-i18n="login.submit">登录</span>
        </button>


        <div class="login-legal">
          <span class="login-legal-links">
            <a href="#" data-i18n="login.terms">服务条款</a>
            <a href="#" data-i18n="login.privacy">隐私政策</a>
          </span>
          <a class="login-copy" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" data-i18n="login.copy">工信部备案号 浙ICP备0000000号-1</a>
        </div>
      </form>

      <!-- 找回密码卡：3 步，不跳页 -->
      <form class="login-card" id="resetForm" hidden novalidate>
        <h2 class="login-card-title" data-i18n="reset.title">找回密码</h2>

        <div class="steps login-steps" id="resetSteps">
          <div class="step is-active" data-step="1"><span class="step-dot">1</span><span class="step-text" data-i18n="reset.s1">账号</span></div>
          <div class="step-line"></div>
          <div class="step" data-step="2"><span class="step-dot">2</span><span class="step-text" data-i18n="reset.s2">验证</span></div>
          <div class="step-line"></div>
          <div class="step" data-step="3"><span class="step-dot">3</span><span class="step-text" data-i18n="reset.s3">新密码</span></div>
        </div>

        <div class="login-alert" id="resetAlert" role="alert" hidden></div>

        <div class="login-view" id="resetStep1">
          <div class="login-field">
            <label class="t-body1 login-label" for="resetAccount" data-i18n="login.account">账号</label>
            <input id="resetAccount" name="reset-account" class="input input-lg login-input" type="text"
                   placeholder="请输入账号" data-i18n-ph="login.account.ph" autocomplete="username" aria-label="账号">
          </div>
          <button class="btn btn-primary btn-lg login-submit" type="button" data-reset-go="2" data-i18n="reset.next">下一步</button>
          <p class="login-help"><a class="t-link login-link" href="#" data-login-back data-i18n="reset.back">返回登录</a></p>
        </div>

        <div class="login-view" id="resetStep2" hidden>
          <div class="login-field">
            <label class="t-body1 login-label" for="resetCode" data-i18n="reset.code">验证码</label>
            <div class="login-code">
              <input id="resetCode" name="reset-code" class="input input-lg" type="text" inputmode="numeric" maxlength="6"
                     placeholder="请输入 6 位验证码" data-i18n-ph="reset.code.ph" autocomplete="one-time-code" aria-label="验证码">
              <button class="btn btn-secondary login-code-btn" id="sendCode" type="button" data-i18n="reset.send">获取验证码</button>
            </div>
            <p class="login-hint" data-i18n="reset.code.hint">验证码 10 分钟内有效</p>
          </div>
          <button class="btn btn-primary btn-lg login-submit" type="button" data-reset-go="3" data-i18n="reset.next">下一步</button>
          <p class="login-help"><a class="t-link login-link" href="#" data-reset-back="1" data-i18n="reset.backstep">上一步</a></p>
        </div>

        <div class="login-view" id="resetStep3" hidden>
          <div class="login-field">
            <label class="t-body1 login-label" for="newPwd" data-i18n="reset.new">新密码</label>
            <input id="newPwd" name="new-password" class="input input-lg login-input" type="password"
                   placeholder="8–20 位，含字母与数字" data-i18n-ph="reset.new.ph" autocomplete="new-password" aria-label="新密码">
          </div>
          <div class="login-field">
            <label class="t-body1 login-label" for="newPwd2" data-i18n="reset.confirm">确认新密码</label>
            <input id="newPwd2" name="new-password-confirm" class="input input-lg login-input" type="password"
                   placeholder="请再次输入新密码" data-i18n-ph="reset.confirm.ph" autocomplete="new-password" aria-label="确认新密码">
          </div>
          <button class="btn btn-primary btn-lg login-submit" type="submit" data-i18n="reset.done">重置密码</button>
          <p class="login-help"><a class="t-link login-link" href="#" data-login-back data-i18n="reset.back">返回登录</a></p>
        </div>
      </form>

      <!-- 完成态卡（重置成功 / 登录成功共用） -->
      <div class="login-card" id="doneCard" hidden>
        <div class="login-done">
          <span class="login-done-ico">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 4 12 L 9 17 L 20 6"/></svg>
          </span>
          <span class="login-done-title" id="doneTitle" data-i18n="done.gotitle">登录成功</span>
          <span class="login-done-desc" id="doneDesc" data-i18n="done.godesc">正在进入工作台…</span>
        </div>
        <p class="login-help"><a class="t-link login-link" href="#" data-login-back data-i18n="done.back">返回登录</a></p>
      </div>

      <p class="login-help">示例：填写任意账号 / 密码即进入成功态；留空提交显示错误态。</p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var dict = {
    zh: {
      'login.sys': '弘设汇管理平台', 'login.sysdesc': '注塑机 · 智能工厂数据管理', 'login.title': '登录',
      'login.account': '账号', 'login.account.ph': '请输入账号', 'login.password': '密码', 'login.password.ph': '请输入密码',
      'login.caps': '大写锁定已开启', 'login.remember': '记住我', 'login.forgot': '忘记密码？',
      'login.showpwd': '显示密码', 'login.hidepwd': '隐藏密码',
      'login.submit': '登录',
      'login.terms': '服务条款', 'login.privacy': '隐私政策', 'login.copy': '工信部备案号 浙ICP备0000000号-1',
      'reset.title': '找回密码', 'reset.s1': '账号', 'reset.s2': '验证', 'reset.s3': '新密码',
      'reset.next': '下一步', 'reset.back': '返回登录', 'reset.backstep': '上一步',
      'reset.code': '验证码', 'reset.code.ph': '请输入 6 位验证码', 'reset.code.hint': '验证码 10 分钟内有效', 'reset.send': '获取验证码',
      'reset.new': '新密码', 'reset.new.ph': '8–20 位，含字母与数字', 'reset.confirm': '确认新密码', 'reset.confirm.ph': '请再次输入新密码',
      'reset.done': '重置密码', 'done.gotitle': '登录成功', 'done.godesc': '正在进入工作台…',
      'done.rtitle': '密码重置成功', 'done.rdesc': '请使用新密码重新登录', 'done.back': '返回登录',
      'err.empty': '请输入账号和密码', 'err.bad': '账号或密码错误，请重试', 'err.code': '验证码错误，请重试',
      'err.pwd': '新密码需 8–20 位且包含字母与数字', 'err.pwd2': '两次输入的新密码不一致', 'sending': '重新发送(', 'send': '获取验证码'
    },
    en: {
      'login.sys': 'Hongshi Hui Platform', 'login.sysdesc': 'Injection Molding · Smart Factory', 'login.title': 'Sign in',
      'login.account': 'Account', 'login.account.ph': 'Enter account', 'login.password': 'Password', 'login.password.ph': 'Enter password',
      'login.caps': 'Caps Lock is on', 'login.remember': 'Remember me', 'login.forgot': 'Forgot password?',
      'login.showpwd': 'Show password', 'login.hidepwd': 'Hide password',
      'login.submit': 'Sign in',
      'login.terms': 'Terms', 'login.privacy': 'Privacy', 'login.copy': 'ICP Filing: 浙ICP备0000000号-1',
      'reset.title': 'Reset password', 'reset.s1': 'Account', 'reset.s2': 'Verify', 'reset.s3': 'New password',
      'reset.next': 'Next', 'reset.back': 'Back to sign in', 'reset.backstep': 'Previous',
      'reset.code': 'Code', 'reset.code.ph': '6-digit code', 'reset.code.hint': 'Valid for 10 minutes', 'reset.send': 'Send code',
      'reset.new': 'New password', 'reset.new.ph': '8–20 chars, letters and numbers', 'reset.confirm': 'Confirm', 'reset.confirm.ph': 'Repeat new password',
      'reset.done': 'Reset password', 'done.gotitle': 'Signed in', 'done.godesc': 'Opening workspace…',
      'done.rtitle': 'Password reset', 'done.rdesc': 'Sign in with your new password', 'done.back': 'Back to sign in',
      'err.empty': 'Enter account and password', 'err.bad': 'Incorrect account or password', 'err.code': 'Incorrect code',
      'err.pwd': 'Use 8–20 characters with letters and numbers', 'err.pwd2': 'Passwords do not match', 'sending': 'Resend(', 'send': 'Send code'
    }
  };
  var lang = 'zh';
  function t(k) { return (dict[lang] && dict[lang][k]) || k; }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (dict[lang][k]) el.textContent = dict[lang][k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      var k = el.getAttribute('data-i18n-ph');
      if (dict[lang][k]) el.setAttribute('placeholder', dict[lang][k]);
    });
    document.getElementById('langLabel').textContent = lang === 'zh' ? '简体中文' : 'English';
    document.querySelectorAll('.lang-opt[data-lang]').forEach(function (o) {
      o.classList.toggle('on', o.getAttribute('data-lang') === lang);
    });
  }

  var langSel = document.getElementById('langSel');
  document.getElementById('langTrigger').addEventListener('click', function (e) {
    e.stopPropagation();
    langSel.classList.toggle('open');
    this.setAttribute('aria-expanded', langSel.classList.contains('open') ? 'true' : 'false');
  });
  document.querySelectorAll('.lang-opt[data-lang]').forEach(function (o) {
    o.addEventListener('click', function (e) {
      e.stopPropagation();
      lang = this.getAttribute('data-lang');
      langSel.classList.remove('open');
      applyLang();
    });
  });
  document.addEventListener('click', function () { langSel.classList.remove('open'); });

  var loginForm = document.getElementById('loginForm');
  var resetForm = document.getElementById('resetForm');
  var doneCard = document.getElementById('doneCard');
  var alertBox = document.getElementById('loginAlert');
  var resetAlert = document.getElementById('resetAlert');
  var submitBtn = document.getElementById('loginSubmit');
  var spin = document.getElementById('loginSpin');
  var submitText = document.getElementById('loginSubmitText');

  function showAlert(el, msg) { el.textContent = msg; el.hidden = false; }
  function hideAlert(el) { el.textContent = ''; el.hidden = true; }
  function view(name) {
    loginForm.hidden = name !== 'login';
    resetForm.hidden = name !== 'reset';
    doneCard.hidden = name !== 'done';
  }
  function done(kind) {
    document.getElementById('doneTitle').textContent = t(kind === 'reset' ? 'done.rtitle' : 'done.gotitle');
    document.getElementById('doneDesc').textContent = t(kind === 'reset' ? 'done.rdesc' : 'done.godesc');
    view('done');
  }
  function goStep(n) {
    [1, 2, 3].forEach(function (i) {
      document.getElementById('resetStep' + i).hidden = i !== n;
      var s = document.querySelector('#resetSteps .step[data-step="' + i + '"]');
      s.classList.toggle('is-active', i === n);
      s.classList.toggle('is-done', i < n);
    });
    hideAlert(resetAlert);
  }

  var pwd = document.getElementById('password');
  var eye = document.getElementById('pwdToggle');
  eye.addEventListener('click', function () {
    var on = pwd.type === 'password';
    pwd.type = on ? 'text' : 'password';
    eye.setAttribute('aria-pressed', on ? 'true' : 'false');
    eye.setAttribute('aria-label', on ? t('login.hidepwd') : t('login.showpwd'));
  });
  pwd.addEventListener('keyup', function (e) {
    document.getElementById('loginHint').hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
  });
  pwd.addEventListener('keydown', function (e) {
    document.getElementById('loginHint').hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
  });

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    hideAlert(alertBox);
    var account = document.getElementById('account').value.trim();
    if (!account || !pwd.value) { showAlert(alertBox, t('err.empty')); return; }
    spin.hidden = false;
    submitBtn.disabled = true;
    submitText.textContent = t('login.submit');
    setTimeout(function () {
      spin.hidden = true;
      submitBtn.disabled = false;
      if (!account || !pwd.value) { showAlert(alertBox, t('err.bad')); return; }
      done('login');
    }, 700);
  });

  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    hideAlert(alertBox);
    goStep(1);
    view('reset');
  });
  document.querySelectorAll('[data-login-back]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); view('login'); });
  });
  document.querySelectorAll('[data-reset-go]').forEach(function (b) {
    b.addEventListener('click', function () {
      hideAlert(resetAlert);
      var n = parseInt(this.getAttribute('data-reset-go'), 10);
      if (n === 2) {
        if (!document.getElementById('resetAccount').value.trim()) { showAlert(resetAlert, t('err.empty')); return; }
      } else if (n === 3) {
        if (!/^\d{6}$/.test(document.getElementById('resetCode').value.trim())) { showAlert(resetAlert, t('err.code')); return; }
      }
      goStep(n);
    });
  });
  document.querySelectorAll('[data-reset-back]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); goStep(parseInt(this.getAttribute('data-reset-back'), 10)); });
  });

  var sendBtn = document.getElementById('sendCode');
  var timer = null;
  sendBtn.addEventListener('click', function () {
    if (timer) return;
    var left = 60;
    sendBtn.disabled = true;
    sendBtn.textContent = t('sending') + left + 's)';
    timer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(timer); timer = null;
        sendBtn.disabled = false;
        sendBtn.textContent = t('send');
      } else {
        sendBtn.textContent = t('sending') + left + 's)';
      }
    }, 1000);
  });

  resetForm.addEventListener('submit', function (e) {
    e.preventDefault();
    hideAlert(resetAlert);
    var p1 = document.getElementById('newPwd').value;
    var p2 = document.getElementById('newPwd2').value;
    if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d!@#$%^&*_.-]{8,20}$/.test(p1)) { showAlert(resetAlert, t('err.pwd')); return; }
    if (p1 !== p2) { showAlert(resetAlert, t('err.pwd2')); return; }
    done('reset');
  });

  applyLang();
})();
</script>
</body>
</html>
