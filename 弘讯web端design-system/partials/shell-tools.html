<!--
  外壳工具区（.ws-tools）单点真源 —— 2026-11-20 建立。
  ─ 谁读它：scripts/sync-shell-tools.js 把它注入各页；scripts/check-shell-chrome.js 以它为比对基准。
  ─ 改法：只改本文件 → node scripts/sync-shell-tools.js → 再跑 sync-showcase / build-share-web 重出副本与分享版。
  ─ 路径约定：按 Web 端根相对写（assets/…）；注入 showcase/ 下的页面时脚本自动改写为 ../assets/…。
  ─ 禁改：page-template.html / 规范展示 / 看板 / V7 里的副本（会被覆盖）。
-->
<div class="ws-tools">        <a class="tool-ico" href="#" title="首页" data-i18n-title="tool.home" aria-label="首页">

        </a>
        <span class="ws-sep"></span>
        <!-- 全屏：默认不绑定交互，业务按需实现（保留 #fsBtn 挂载点） -->

        </button>
        <div class="pop" id="themePop">
          <button class="tool-ico" type="button" aria-haspopup="menu" aria-expanded="false" title="主题切换" data-i18n-title="tool.theme" aria-label="主题切换">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 12 3.5 C 7.3 3.5 3.5 7.3 3.5 12 C 3.5 16.7 7.3 20.5 12 20.5 C 13.4 20.5 14.3 19.6 14.3 18.4 C 14.3 17.5 13.7 17 13.7 16.1 C 13.7 14.9 14.7 13.9 16 13.9 H 18 C 20.1 13.9 21.7 12.3 21.7 10.2 C 21.7 6.5 17.2 3.5 12 3.5 Z"/><circle cx="8" cy="9.2" r="1.1"/><circle cx="12" cy="7.2" r="1.1"/><circle cx="16" cy="9.2" r="1.1"/><circle cx="7.4" cy="13.4" r="1.1"/></svg>

            <div class="pop-item theme-opt on" role="menuitem" data-skin="default">
              <span class="theme-dot" style="background:#005EAE"></span><span data-i18n="theme.default">默认蓝</span>
              <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 5 12 L 10 17 L 19 8"/></svg></span>
            </div>
            <div class="pop-item theme-opt" role="menuitem" data-skin="cyan">
              <span class="theme-dot" style="background:#0E7490"></span><span data-i18n="theme.cyan">科技青</span>

            <div class="pop-item theme-opt" role="menuitem" data-skin="green">

            </div>
            <div class="pop-item theme-opt" role="menuitem" data-skin="amber">
              <span class="theme-dot" style="background:#B45309"></span><span data-i18n="theme.amber">琥珀橙</span>
              <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 5 12 L 10 17 L 19 8"/></svg></span>

            <div class="pop-item theme-opt" role="menuitem" data-theme="dark">
              <span class="theme-dot" style="background:#1E293B"></span><span data-i18n="theme.dark">暗色</span>
              <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 5 12 L 10 17 L 19 8"/></svg></span>
            </div>
          </div>
        </div>
                
        <div class="pop" id="appPop">
          <button class="tool-ico" type="button" aria-haspopup="dialog" aria-expanded="false" title="APP 下载" data-i18n-title="tool.app" aria-label="APP 下载">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3" width="13" height="18" rx="2.5"/><path d="M 12 8 V 14.5"/><path d="M 9.5 12 L 12 14.5 L 14.5 12"/></svg>

        <span class="ws-sep"></span>
        <div class="pop" id="langPop">

            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M 3.5 12 H 20.5"/><ellipse cx="12" cy="12" rx="4" ry="8.5"/></svg>

            <div class="lang-opt is-disabled" role="menuitem">Français</div>

        </div>
        <span class="ws-sep"></span>
        <div class="pop" id="userPop">
          <button class="user-chip" type="button" aria-haspopup="menu" aria-expanded="false" title="账号">

</div>
